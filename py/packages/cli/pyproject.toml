[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apkdiff"
dynamic = ["version"]
description = "Command line APK size diff tool; installs the apkdiff executable"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "Apache-2.0" }
authors = [{ name = "Jayvin" }]
keywords = ["apk", "dex", "android", "size", "diff", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
# Keep this version in sync with apkdiff_core.__version__.
dependencies = [
    "apkdiff-core==1.0.0a1",
]

[project.scripts]
apkdiff = "apkdiff.cli:main"

[project.urls]
Homepage = "https://github.com/Jayvinz/apkdiff"
Repository = "https://github.com/Jayvinz/apkdiff"
Source = "https://github.com/Jayvinz/apkdiff/tree/main/py"

[tool.setuptools.dynamic]
version = { attr = "apkdiff.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
