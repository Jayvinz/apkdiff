[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apkdiff-core"
dynamic = ["version"]
description = "APK size diff core library: attributes DEX bytes to classes, compares classes and resources, and renders console/JSON/HTML/Markdown reports"
readme = "README.md"
requires-python = ">=3.7"
license = "Apache-2.0"
# Identical copy of the repository-root LICENSE; setuptools cannot reference files outside the package dir.
license-files = ["LICENSE"]
authors = [{ name = "Jayvin" }]
keywords = ["apk", "dex", "android", "size", "diff", "r8", "proguard"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Jayvinz/apkdiff"
Repository = "https://github.com/Jayvinz/apkdiff"
Source = "https://github.com/Jayvinz/apkdiff/tree/main/py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "apkdiff_core.__version__" }
